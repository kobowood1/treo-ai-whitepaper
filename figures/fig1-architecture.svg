<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 416' width='760' height='416' role='img' aria-label='One learner model serves student, teacher and parent' font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size='13'><rect width='760' height='416' fill='#ffffff'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8a877f'/></marker></defs><text x='24' y='28' font-size='15' font-weight='600' fill='#1d1d1b' text-anchor='start'>One learner model serves student, teacher and parent</text><text x='24' y='48' font-size='11.5' font-weight='400' fill='#5f5d58' text-anchor='start'>Each school runs its own instance; student data is never pooled across schools</text><rect x='24' y='164' width='712' height='228' rx='8' fill='#f3f1ec' stroke='#8a877f' stroke-width='1'/><text x='380' y='380' font-size='11.5' font-weight='600' fill='#5f5d58' text-anchor='middle'>One school's dedicated instance</text><path d='M140 136V184' fill='none' stroke='#8a877f' stroke-width='1.25' marker-start='url(#a)' marker-end='url(#a)'/><path d='M140 280V240' fill='none' stroke='#8a877f' stroke-width='1.25' marker-end='url(#a)'/><path d='M380 136V184' fill='none' stroke='#8a877f' stroke-width='1.25' marker-start='url(#a)' marker-end='url(#a)'/><path d='M380 280V240' fill='none' stroke='#8a877f' stroke-width='1.25' marker-end='url(#a)'/><path d='M620 136V184' fill='none' stroke='#8a877f' stroke-width='1.25' marker-start='url(#a)' marker-end='url(#a)'/><path d='M620 280V240' fill='none' stroke='#8a877f' stroke-width='1.25' marker-end='url(#a)'/><rect x='40.0' y='64' width='200' height='72' rx='8' fill='#ffffff' stroke='#8a877f' stroke-width='1.25'/><text x='140' y='88' font-size='13' font-weight='600' fill='#1d1d1b' text-anchor='middle'>Student</text><text x='140' y='106' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Shows work by photo or voice</text><text x='140' y='122' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Gets guiding questions</text><rect x='280.0' y='64' width='200' height='72' rx='8' fill='#ffffff' stroke='#8a877f' stroke-width='1.25'/><text x='380' y='88' font-size='13' font-weight='600' fill='#1d1d1b' text-anchor='middle'>Teacher</text><text x='380' y='106' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Sees gaps by class, student</text><text x='380' y='122' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Approves drafted feedback</text><rect x='520.0' y='64' width='200' height='72' rx='8' fill='#ffffff' stroke='#8a877f' stroke-width='1.25'/><text x='620' y='88' font-size='13' font-weight='600' fill='#1d1d1b' text-anchor='middle'>Parent</text><text x='620' y='106' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Gets plain weekly guidance</text><text x='620' y='122' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Learns how to help at home</text><rect x='40' y='184' width='680' height='56' rx='8' fill='#e9eefb' stroke='#2459d6' stroke-width='2'/><text x='380' y='208' font-size='13' font-weight='600' fill='#1d1d1b' text-anchor='middle'>Shared learner model</text><text x='380' y='226' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Each student's mastery and gaps on the knowledge graph, updated by every interaction</text><rect x='40.0' y='280' width='200' height='72' rx='8' fill='#ffffff' stroke='#8a877f' stroke-width='1.25'/><text x='140' y='304' font-size='13' font-weight='600' fill='#1d1d1b' text-anchor='middle'>Curriculum grounding</text><text x='140' y='322' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>School's approved content</text><text x='140' y='338' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Common Core and NGSS</text><rect x='280.0' y='280' width='200' height='72' rx='8' fill='#ffffff' stroke='#8a877f' stroke-width='1.25'/><text x='380' y='304' font-size='13' font-weight='600' fill='#1d1d1b' text-anchor='middle'>Prerequisite graph</text><text x='380' y='322' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Root-cause gap diagnosis</text><text x='380' y='338' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Extends open os-taxonomy</text><rect x='520.0' y='280' width='200' height='72' rx='8' fill='#ffffff' stroke='#8a877f' stroke-width='1.25'/><text x='620' y='304' font-size='13' font-weight='600' fill='#1d1d1b' text-anchor='middle'>Multimodal model</text><text x='620' y='322' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Reads handwriting, diagrams</text><text x='620' y='338' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Hears spoken reasoning</text></svg>