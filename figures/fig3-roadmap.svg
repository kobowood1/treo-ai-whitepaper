<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 248' width='760' height='248' role='img' aria-label='Four phases take Treo from pilot to national scale by 2031' font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size='13'><rect width='760' height='248' fill='#ffffff'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8a877f'/></marker></defs><text x='24' y='28' font-size='15' font-weight='600' fill='#1d1d1b' text-anchor='start'>Four phases take Treo from pilot to national scale by 2031</text><text x='24' y='48' font-size='11.5' font-weight='400' fill='#5f5d58' text-anchor='start'>Each phase opens only when the gate before it is met</text><line x1='24' x2='736' y1='92' y2='92' stroke='#8a877f' stroke-width='1.25'/><path d='M198 84l8 8l-8 8l-8 -8z' fill='#8a877f'/><text x='198' y='76' font-size='11.5' font-weight='400' fill='#5f5d58' text-anchor='middle'>Pilot letters signed</text><path d='M380 84l8 8l-8 8l-8 -8z' fill='#8a877f'/><text x='380' y='76' font-size='11.5' font-weight='400' fill='#5f5d58' text-anchor='middle'>Learning gains shown</text><path d='M562 84l8 8l-8 8l-8 -8z' fill='#8a877f'/><text x='562' y='76' font-size='11.5' font-weight='400' fill='#5f5d58' text-anchor='middle'>Schools renew</text><rect x='24' y='112' width='166' height='112' rx='8' fill='#2459d6' fill-opacity='0.12' stroke='#2459d6' stroke-width='2'/><text x='107.0' y='136' font-size='13' font-weight='600' fill='#1d1d1b' text-anchor='middle'>Found and prepare</text><text x='107.0' y='152' font-size='11.5' font-weight='400' fill='#5f5d58' text-anchor='middle'>Q4 2026 to Q2 2027</text><text x='107.0' y='176' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Form the company</text><text x='107.0' y='192' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Sign 2-3 pilot schools</text><text x='107.0' y='208' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Algebra, physics MVP</text><rect x='206' y='112' width='166' height='112' rx='8' fill='#ffffff' fill-opacity='1' stroke='#8a877f' stroke-width='1.25'/><text x='289.0' y='136' font-size='13' font-weight='600' fill='#1d1d1b' text-anchor='middle'>Pilot</text><text x='289.0' y='152' font-size='11.5' font-weight='400' fill='#5f5d58' text-anchor='middle'>2027-28 school year</text><text x='289.0' y='176' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>5 pilot schools</text><text x='289.0' y='192' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>About 2,000 students</text><text x='289.0' y='208' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Parent layer released</text><rect x='388' y='112' width='166' height='112' rx='8' fill='#ffffff' fill-opacity='1' stroke='#8a877f' stroke-width='1.25'/><text x='471.0' y='136' font-size='13' font-weight='600' fill='#1d1d1b' text-anchor='middle'>Regional</text><text x='471.0' y='152' font-size='11.5' font-weight='400' fill='#5f5d58' text-anchor='middle'>2028-29 school year</text><text x='471.0' y='176' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>25 schools, 3+ states</text><text x='471.0' y='192' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Dept. of Ed. grants</text><text x='471.0' y='208' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>NSF or IES research</text><rect x='570' y='112' width='166' height='112' rx='8' fill='#ffffff' fill-opacity='1' stroke='#8a877f' stroke-width='1.25'/><text x='653.0' y='136' font-size='13' font-weight='600' fill='#1d1d1b' text-anchor='middle'>National</text><text x='653.0' y='152' font-size='11.5' font-weight='400' fill='#5f5d58' text-anchor='middle'>2029 to 2031</text><text x='653.0' y='176' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>100 to 700 schools</text><text x='653.0' y='192' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Third-party study</text><text x='653.0' y='208' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>About 85 U.S. staff</text></svg>