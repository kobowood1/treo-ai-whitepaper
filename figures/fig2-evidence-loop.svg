<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 330' width='760' height='330' role='img' aria-label='Every exchange updates one learner model that all three views read' font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size='13'><rect width='760' height='330' fill='#ffffff'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8a877f'/></marker></defs><text x='20' y='28' font-size='15' font-weight='600' fill='#1d1d1b' text-anchor='start'>Every exchange updates one learner model that all three views read</text><text x='20' y='48' font-size='11.5' font-weight='400' fill='#5f5d58' text-anchor='start'>The tutoring loop runs continuously; teacher and parent views read the same model on demand</text><path d='M180 146H210' fill='none' stroke='#8a877f' stroke-width='1.25' marker-end='url(#a)'/><path d='M370 146H400' fill='none' stroke='#8a877f' stroke-width='1.25' marker-end='url(#a)'/><path d='M560 146H590' fill='none' stroke='#8a877f' stroke-width='1.25' marker-end='url(#a)'/><path d='M670 110V84H290V110' fill='none' stroke='#8a877f' stroke-width='1.25' marker-end='url(#a)'/><text x='480' y='76' font-size='11.5' font-weight='400' fill='#5f5d58' text-anchor='middle'>the next question adapts to the updated model</text><path d='M670 182V230' fill='none' stroke='#8a877f' stroke-width='1.25' marker-end='url(#a)'/><path d='M630 182V206H480V230' fill='none' stroke='#8a877f' stroke-width='1.25' marker-end='url(#a)'/><rect x='20.0' y='110' width='160' height='72' rx='8' fill='#ffffff' stroke='#8a877f' stroke-width='1.25'/><text x='100' y='134' font-size='13' font-weight='600' fill='#1d1d1b' text-anchor='middle'>Student work</text><text x='100' y='152' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Typed, photo or spoken</text><text x='100' y='168' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>answer or reasoning</text><rect x='210.0' y='110' width='160' height='72' rx='8' fill='#ffffff' stroke='#8a877f' stroke-width='1.25'/><text x='290' y='134' font-size='13' font-weight='600' fill='#1d1d1b' text-anchor='middle'>Socratic tutor</text><text x='290' y='152' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Asks the next question</text><text x='290' y='168' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>One step at a time</text><rect x='400.0' y='110' width='160' height='72' rx='8' fill='#ffffff' stroke='#8a877f' stroke-width='1.25'/><text x='480' y='134' font-size='13' font-weight='600' fill='#1d1d1b' text-anchor='middle'>Evidence step</text><text x='480' y='152' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Concept and error type</text><text x='480' y='168' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Likely root cause</text><rect x='590.0' y='110' width='160' height='72' rx='8' fill='#2459d6' fill-opacity='0.12' stroke='#2459d6' stroke-width='2'/><text x='670' y='134' font-size='13' font-weight='600' fill='#1d1d1b' text-anchor='middle'>Learner model</text><text x='670' y='152' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Mastery per concept</text><text x='670' y='168' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Change capped at 0.15</text><rect x='400.0' y='230' width='160' height='72' rx='8' fill='#ffffff' stroke='#8a877f' stroke-width='1.25'/><text x='480' y='254' font-size='13' font-weight='600' fill='#1d1d1b' text-anchor='middle'>Teacher copilot</text><text x='480' y='272' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Root causes and draft</text><text x='480' y='288' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>feedback to approve</text><rect x='590.0' y='230' width='160' height='72' rx='8' fill='#ffffff' stroke='#8a877f' stroke-width='1.25'/><text x='670' y='254' font-size='13' font-weight='600' fill='#1d1d1b' text-anchor='middle'>Parent guide</text><text x='670' y='272' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>Weekly plain-language</text><text x='670' y='288' font-size='11.5' font-weight='400' fill='#1d1d1b' text-anchor='middle'>tips; school decides</text><text x='20' y='254' font-size='11.5' font-weight='400' fill='#5f5d58' text-anchor='start'>Error types: computational,</text><text x='20' y='270' font-size='11.5' font-weight='400' fill='#5f5d58' text-anchor='start'>procedural or conceptual.</text><text x='20' y='294' font-size='11.5' font-weight='400' fill='#5f5d58' text-anchor='start'>Nothing reaches a student record</text><text x='20' y='310' font-size='11.5' font-weight='400' fill='#5f5d58' text-anchor='start'>without teacher approval.</text></svg>